name: Temporary platform playtest
on:
  push:
    branches: [codex/platform-playtest-20261112]
permissions:
  contents: read
jobs:
  playtest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pyte
      - if: runner.os == 'Windows'
        run: python -m pip install --only-binary=:all: pywinpty
      - run: python -B -u .github/platform_playtest.py
